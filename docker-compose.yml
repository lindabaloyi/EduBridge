services:
  postgres:
    image: postgres:16
    container_name: edubridge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: edubridge
      POSTGRES_USER: edubridge
      POSTGRES_PASSWORD: edubridge_dev_password

    ports:
      - "5432:5432"

    volumes:
      - edubridge_postgres_data:/var/lib/postgresql/data

volumes:
  edubridge_postgres_data: